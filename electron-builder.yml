appId: com.synteehelper.app
productName: Syntee Helper
copyright: Copyright © 2026 Syntee

directories:
  buildResources: resources
  output: dist

# Бандленный ripgrep (@vscode/ripgrep-*) — бинарь rg.exe должен быть
# распакован из asar, иначе не исполняется. findRg() заменяет app.asar →
# app.asar.unpacked в пути.
# onnxruntime-node — нативный .node-бинарь, требует распаковки из asar.
# @huggingface/transformers — динамические require, требует распаковки.
asar: true
asarUnpack:
  - node_modules/@vscode/ripgrep/**
  - node_modules/@vscode/ripgrep-*/**
  - node_modules/onnxruntime-node/**
  - node_modules/@huggingface/transformers/**

# Resources copied to the install root (next to the client exe).
# The launcher binary is NOT included here — it's a separate 7 MB download
# from the website. The zip target (used for updates) contains only the
# client files that the launcher extracts into current/.
extraResources:
  - from: resources/
    to: ./
    filter:
      - "**/*"
      - "!syntee-launcher.exe"
      - "!installer.nsh"
      - "!launcher.json"
      - "!native/**"
      - "!sidecar/**"

win:
  target:
    - target: zip
      arch: [x64]
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  # A platform list with only exclusions would package the entire checkout.
  files:
    - out/**/*
    - package.json
    - "!**/node_modules/@huggingface/transformers/.cache/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
  extraResources:
    - from: resources/launcher.json
      to: launcher.json
    - from: resources/native/
      to: native/
    - from: resources/sidecar/
      to: sidecar/
      filter:
        - "*.exe"
        - "*.dll"

linux:
  target: dir
  executableName: syntee-helper
  icon: resources/icon.png
  files:
    - out/**/*
    - package.json
    - "!**/node_modules/@huggingface/transformers/.cache/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/**"
    - "!**/node_modules/node-pty/prebuilds/{darwin-*,win32-*}/**"
  asarUnpack:
    - node_modules/node-pty/build/Release/**
  extraResources:
    - from: resources/sidecar/
      to: sidecar/
      filter:
        - syntee-sidecar
        - "*.so*"

# The zip is uploaded to the gateway admin and activated per channel.
# The launcher downloads it on first install and on updates, extracts it
# into current/, and swaps the old build out.
artifactName: ${productName}-${version}-${arch}.${ext}

publish: null
