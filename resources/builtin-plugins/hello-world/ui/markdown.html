<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 16px;
    font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
    background: transparent; color: #d6d3f0;
  }
  .wrap { border: 1px solid rgba(167,139,250,.35); border-radius: 10px; padding: 10px 14px; background: rgba(124,58,237,.08); }
  .lang { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a78bfa; margin-bottom: 6px; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.55 'Cascadia Code', Consolas, monospace; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lang">hello-demo · plugin renderer</div>
    <pre id="code">(ожидание данных…)</pre>
  </div>
<script>
  // Кодоблок приходит как widget-data (postMessage), как у инлайн-виджетов.
  function render(data) {
    var code = data && (data.code != null ? data.code : data.text != null ? data.text : data)
    document.getElementById('code').textContent = typeof code === 'string' ? code : JSON.stringify(code, null, 2)
  }
  window.addEventListener('message', function (e) {
    var d = e.data
    if (d && d.type === 'widget-data') render(d.data)
    else if (d && typeof d === 'object' && !d.type) render(d)
  })
  // Данные могут прийти в query (?data=...) — как у overlay.
  try {
    var m = location.search.match(/[?&]data=([^&]+)/)
    if (m) render(JSON.parse(decodeURIComponent(m[1])))
  } catch (e) {}
</script>
</body>
</html>
