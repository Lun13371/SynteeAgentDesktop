name: CI

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev, release]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # В репозитории накопились старые ошибки типов (VoicePage,
      # codeHighlightHTML и др.): сборка идёт через esbuild и их не видит.
      # Пока это не ворота для PR — чистим постепенно и снимаем
      # continue-on-error, когда baseline станет нулевым.
      - name: Typecheck (informational)
        continue-on-error: true
        run: npm run typecheck

      # Baseline линтера тоже не нулевой (~1450 ошибок, в основном
      # no-undef в tests/*.mjs). Информативно, пока не расчистим.
      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint:pretty

      - name: Build bundles
        run: npm run build

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Tests
        run: |
          # tests/task-summary*.test.mjs — 6 падающих тестов из baseline
          # (сверяют исходники регулярками, к CI отношения не имеют).
          # Исключены, пока не починены, иначе ворота всегда красные.
          files=$(ls tests/*.test.cjs tests/*.test.mjs | grep -vE 'task-summary(-delegation)?\.test\.mjs')
          xvfb-run -a node --test $files
