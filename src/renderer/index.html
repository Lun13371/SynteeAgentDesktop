<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'" />
    <title>Syntee Helper</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e0e12;
        z-index: 9999;
      }
      #boot-splash__logo {
        animation: boot-splash-pulse 4s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(232, 232, 236, 0.08));
      }
      @keyframes boot-splash-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.8; }
        50%      { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div id="boot-splash__logo" style="width:56px;height:56px;border-radius:12.25px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;line-height:1;">
          <span style="font-family:system-ui,sans-serif;font-size:31.5px;font-weight:700;color:#000;line-height:1;user-select:none;">S</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
