extends: ./electron-builder.yml
appId: com.synteehelper.desktop
# Имя совпадает с прежней установкой (%LOCALAPPDATA%\Programs\Syntee Helper):
# новая версия встаёт на то же место, второго каталога не появляется.
productName: Syntee Helper
# Locked packages include Windows x64 prebuilds. Avoid rebuilding them with
# a different local Node toolchain than the packaged Electron uses.
npmRebuild: false

directories:
  output: dist/windows

win:
  target: nsis

nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Syntee-Helper-Setup-${version}-${arch}.${ext}
